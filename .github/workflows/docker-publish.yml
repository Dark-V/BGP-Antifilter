name: Publish Docker image

on:
  push:
    branches:
      - main
      - feature/portainer-stack
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/dark-v/bgp-antifilter

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=portainer
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published Portainer image
        env:
          PORTAINER_SMOKE_IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          RUN_DOCKER_SMOKE: "1"
        run: |
          python -m pip install -r requirements.txt
          docker pull "$PORTAINER_SMOKE_IMAGE"
          docker tag "$PORTAINER_SMOKE_IMAGE" bgp-antifilter-bird:smoke
          python -m unittest tests.test_smoke_docker.DockerSmokeTests.test_portainer_stack_uses_embedded_config_and_named_volumes -v
