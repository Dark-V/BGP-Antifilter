name: bgp-antifilter

services:
  bgp-antifilter:
    container_name: bgp-antifilter
    image: "ghcr.io/leonidoz/bgp-antifilter:${BGP_ANTIFILTER_VERSION:-dev}"
    build:
      context: .
      dockerfile: deploy/Dockerfile
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/bird.conf.template:/etc/bird/bird.conf.template:ro
      - ./generated:/etc/bird/generated
      - ./config:/etc/bird/config
      - bird-run:/run/bird
      - ./:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      org.opencontainers.image.source: "https://github.com/LeonidOz/BGP-Antifilter"
      org.opencontainers.image.url: "https://github.com/LeonidOz/BGP-Antifilter"
    environment:
      MY_AS: "${MY_AS:-64500}"
      PEER_AS: "${PEER_AS:-${MT_AS:-65455}}"
      PEER_IP: "${PEER_IP:-${MT_IP:-192.168.55.1}}"
      MT_AS: "${PEER_AS:-${MT_AS:-65455}}"
      MT_IP: "${PEER_IP:-${MT_IP:-192.168.55.1}}"
      BIRD_IP: "${BIRD_IP:-192.168.55.5}"
      ROUTER_ID: "${ROUTER_ID:-192.168.55.5}"
      BGP_COMMUNITY: "${BGP_COMMUNITY:-65432,500}"
      CONFIG_DIR: /etc/bird/config
      LISTS_FILE: /etc/bird/config/lists.txt
      DOMAIN_LIST_URLS_FILE: /etc/bird/config/domain-list-urls.txt
      INCLUDE_ASNS_FILE: /etc/bird/config/include-asns.txt
      INCLUDE_COUNTRIES_FILE: /etc/bird/config/include-countries.txt
      INCLUDE_DOMAINS_FILE: /etc/bird/config/include-domains.txt
      EXCLUDE_DOMAINS_FILE: /etc/bird/config/exclude-domains.txt
      INCLUDE_GOOGLE_RANGES: "${INCLUDE_GOOGLE_RANGES:-1}"
      REQUIRE_ALL_URL_SOURCES: "${REQUIRE_ALL_URL_SOURCES:-0}"
      UPDATE_INTERVAL: "${UPDATE_INTERVAL:-1800}"
      CACHE_MAX_AGE: "${CACHE_MAX_AGE:-604800}"
      FETCH_WORKERS: "${FETCH_WORKERS:-8}"
      FETCH_TIMEOUT: "${FETCH_TIMEOUT:-30}"
      FETCH_ATTEMPTS: "${FETCH_ATTEMPTS:-5}"
      FETCH_RETRY_DELAY: "${FETCH_RETRY_DELAY:-5}"
      DNS_RESOLVERS: "${DNS_RESOLVERS:-}"
      DNS_RESOLVE_TIMEOUT: "${DNS_RESOLVE_TIMEOUT:-3}"
      DNS_WORKERS: "${DNS_WORKERS:-16}"
      DNS_QPS: "${DNS_QPS:-50}"
      DNS_PROXY_ENABLED: "${DNS_PROXY_ENABLED:-0}"
      DNS_PROXY_UPSTREAM: "${DNS_PROXY_UPSTREAM:-}"
      DNS_PROXY_UPSTREAM_PORT: "${DNS_PROXY_UPSTREAM_PORT:-53}"
      DNS_PROXY_BIND: "${DNS_PROXY_BIND:-127.0.0.1}"
      DNS_PROXY_PORT: "${DNS_PROXY_PORT:-53}"
      DNS_PROXY_ALLOWED_CLIENTS: "${DNS_PROXY_ALLOWED_CLIENTS:-127.0.0.1/32 ::1/128}"
      DNS_PROXY_HEALTH_PORT: "${DNS_PROXY_HEALTH_PORT:-8053}"
      DNS_HEALTH_DOMAIN: "${DNS_HEALTH_DOMAIN:-example.org}"
      DNS_BGP_PORT: "${DNS_BGP_PORT:-1179}"
      DNS_ROUTE_GRACE: "${DNS_ROUTE_GRACE:-30}"
      DNS_SYNC_MODE: "${DNS_SYNC_MODE:-async}"
      DNS_SYNC_TIMEOUT: "${DNS_SYNC_TIMEOUT:-1}"
      DNS_SYNC_ON_TIMEOUT: "${DNS_SYNC_ON_TIMEOUT:-servfail}"
      MIN_PREFIX_LENGTH: "${MIN_PREFIX_LENGTH:-8}"
      ALLOW_BROAD_ROUTES: "${ALLOW_BROAD_ROUTES:-0}"
      UPDATE_LOCK_DIR: "${UPDATE_LOCK_DIR:-/etc/bird/generated/update.lock}"
      BGP_PROTOCOL: "${BGP_PROTOCOL:-mikrotik}"
      HEALTHCHECK_REQUIRE_BGP: "${HEALTHCHECK_REQUIRE_BGP:-1}"
      HEALTHCHECK_FAIL_ON_DEGRADED: "${HEALTHCHECK_FAIL_ON_DEGRADED:-0}"
      ADMIN_ENABLED: "${ADMIN_ENABLED:-0}"
      ADMIN_PORT: "${ADMIN_PORT:-8080}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      NO_ADMIN_PASSWORD: "${NO_ADMIN_PASSWORD:-false}"
      RUNTIME_FILE: /etc/bird/generated/runtime.json
      UPDATE_RUNTIME_FILE: /etc/bird/generated/update-runtime.json
      CONTAINER_LOG_FILE: /etc/bird/generated/container.log
      SETTINGS_FILE: /etc/bird/config/settings.json
      SETTINGS_ENV_FILE: /etc/bird/config/settings.env
      WORKSPACE_DIR: /workspace
      ENV_FILE: /workspace/.env
      VERSION_FILE: /workspace/VERSION
      COMPOSE_FILE: /workspace/docker-compose.yml
      UPDATER_COMPOSE_SERVICES: "bgp-antifilter"
      UPDATER_SELF_SERVICE: "bgp-antifilter"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  bird-run:

networks:
  default:
    enable_ipv4: true
    enable_ipv6: false
